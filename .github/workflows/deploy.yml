name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Environment to deploy to
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ddotsmedia/businessportal

jobs:
  build:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/worker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker:${{ github.sha }}

  deploy-staging:
    if: |
      vars.DEPLOY_ENABLED == 'true' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /srv/portal-staging
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose run --rm web pnpm db:migrate
            docker compose up -d

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl -f http://${{ secrets.VPS_HOST }}:3100/api/health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/10 failed, retrying..."
            sleep 10
          done
          echo "Health check failed after 10 retries"
          exit 1

  deploy-production:
    if: |
      vars.DEPLOY_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'production'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://portal.ddotsmedia.com
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /srv/portal-prod
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose run --rm web pnpm db:migrate
            docker compose up -d

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl -f https://portal.ddotsmedia.com/api/health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/10 failed, retrying..."
            sleep 10
          done
          echo "Health check failed, rolling back..."
          ssh -i "${{ secrets.VPS_SSH_KEY }}" ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /srv/portal-prod && \
             export IMAGE_TAG=\$(cat .last_good_tag) && \
             docker compose pull && \
             docker compose up -d"
          exit 1

      - name: Save tag as last good
        if: success()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /srv/portal-prod
            echo "${{ github.sha }}" > .last_good_tag
